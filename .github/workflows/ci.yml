name: NextChapter CI - Frontend & AI RAG Service

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-rag-tests:
    name: Backend AI RAG Tests & Anti-Spoiler Guardrail
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        cd backendAI
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest numpy pydantic python-dotenv

    - name: Run RAG Anti-Spoiler, Streaming & Faithfulness Tests
      run: |
        cd backendAI
        pytest test_rag.py test_streaming.py -v

  frontend-build:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Production Assets
      run: |
        cd frontend
        npm run build

  database-permissions:
    name: Database authorization regression tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Test schema and row-level permissions
      run: python database/tests/run_permissions.py
